
name: Build Raiyan Lottery APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RaiyanLottery-AndroidStudio-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source ZIP
        run: |
          unzip -q RaiyanLottery-AndroidStudio-Source.zip
          test -f RaiyanLottery/settings.gradle.kts

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          /tmp/gradle-8.9/bin/gradle -p RaiyanLottery assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raiyan-Lottery-APK
          path: RaiyanLottery/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
